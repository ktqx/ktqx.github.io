<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>流水线三段码检测器 (通用稳定版)</title>
  <!-- 引入通用条码解码器 ZXing (全浏览器兼容) -->
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
  <!-- 引入本地 OCR 核心 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: #fff;
      overflow: hidden;
      user-select: none;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 50vh;
      background: #000;
    }
    video, #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #dashboard {
      height: 50vh;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #1c1c1e;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2c2c2e;
      color: #fff;
      outline: none;
    }
    button {
      padding: 8px 14px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #007aff;
      color: #fff;
      cursor: pointer;
    }
    button.stop { background: #ff3b30; }
    .stats-card {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #2c2c2e;
      padding: 6px 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-item .num {
      font-size: 20px;
      font-weight: 800;
      color: #30d158;
    }
    .stat-item .num.hit { color: #ff453a; }
    .stat-item .label {
      font-size: 11px;
      color: #aaa;
    }
    #statusBadge {
      font-size: 12px;
      color: #ffd60a;
      text-align: center;
      background: #222;
      padding: 4px;
      border-radius: 4px;
    }
    #logBox {
      flex: 1;
      overflow-y: auto;
      background: #000;
      padding: 6px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      border: 1px solid #333;
    }
    .log-item { margin-bottom: 3px; line-height: 1.3; }
    .log-item.hit { 
      color: #ff3b30; 
      font-weight: bold; 
      background: rgba(255, 59, 48, 0.2); 
      padding: 2px 4px; 
    }
    /* 辅助准星参考线 */
    .crosshair {
      position: absolute;
      top: 50%;
      left: 10%;
      right: 10%;
      height: 2px;
      background: rgba(255, 214, 10, 0.4);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="stage">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
    <div class="crosshair"></div>
  </div>

  <div id="dashboard">
    <div id="statusBadge">正在检查系统组件环境...</div>

    <div class="input-row">
      <input type="text" id="targetTail" value="785" placeholder="尾号/网点 (如: 785)" />
      <button id="btnToggle">启动相机</button>
    </div>

    <div class="stats-card">
      <div class="stat-item">
        <div class="num" id="totalCount">0</div>
        <div class="label">扫码总数</div>
      </div>
      <div class="stat-item">
        <div class="num hit" id="hitCount">0</div>
        <div class="label">命中件数</div>
      </div>
      <div class="stat-item">
        <button id="btnReset" style="background:#444; padding: 4px 8px; font-size: 12px;">换班重置</button>
      </div>
    </div>

    <div id="logBox">
      <div class="log-item" style="color: #666;">系统初始化日志区...</div>
    </div>
  </div>

  <canvas id="cropCanvas" style="display: none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const cropCanvas = document.getElementById('cropCanvas');
    const cropCtx = cropCanvas.getContext('2d');

    const btnToggle = document.getElementById('btnToggle');
    const btnReset = document.getElementById('btnReset');
    const targetInput = document.getElementById('targetTail');
    const totalCountEl = document.getElementById('totalCount');
    const hitCountEl = document.getElementById('hitCount');
    const logBox = document.getElementById('logBox');
    const statusBadge = document.getElementById('statusBadge');

    let stream = null;
    let isRunning = false;
    let isOcrBusy = false;
    let ocrWorker = null;
    let zxingReader = null;
    let useNativeDetector = false;
    let nativeDetector = null;

    const processedBarcodes = new Set();
    let totalDetected = 0;
    let hitDetected = 0;

    // 报警音频发生器
    let audioCtx = null;
    function playAlarm() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(1400, now);
        osc.frequency.exponentialRampToValueAtTime(1800, now + 0.15);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
        if (navigator.vibrate) navigator.vibrate([150, 50, 150]);
      } catch (e) {
        console.error(e);
      }
    }

    // 1. 初始化引擎环境
    async function checkCapabilities() {
      if ('BarcodeDetector' in window) {
        try {
          const supported = await BarcodeDetector.getSupportedFormats();
          if (supported.includes('code_128')) {
            nativeDetector = new BarcodeDetector({ formats: ['code_128'] });
            useNativeDetector = true;
          }
        } catch(e) {}
      }

      if (!useNativeDetector && window.ZXing) {
        zxingReader = new ZXing.BrowserMultiFormatReader();
      }

      appendLog(`解码引擎: ${useNativeDetector ? '硬件加速 BarcodeDetector' : '兼容引擎 ZXing (纯JS模式)'}`);
      statusBadge.textContent = '引擎就绪，请点击“启动相机”';
    }

    // 初始化 OCR
    async function loadOcrEngine() {
      statusBadge.textContent = '正在下载并加载 OCR 模型...';
      try {
        ocrWorker = await Tesseract.createWorker('eng', 1, {
          logger: m => {
            if (m.status === 'downloading tesseract core' || m.status === 'loading tesseract core') {
              statusBadge.textContent = `加载核心组件: ${Math.round((m.progress || 0) * 100)}%`;
            } else if (m.status === 'loading language traineddata') {
              statusBadge.textContent = `下载英文数字库: ${Math.round((m.progress || 0) * 100)}%`;
            }
          }
        });

        await ocrWorker.setParameters({
          tessedit_char_whitelist: '0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        });
        statusBadge.textContent = '● 识别引擎已全部就绪';
        return true;
      } catch (err) {
        statusBadge.textContent = 'OCR 引擎加载失败: ' + err.message;
        appendLog('OCR 加载失败，请检查网络后刷新重试');
        return false;
      }
    }

    // 2. 启动摄像头
    async function startCamera() {
      try {
        if (!ocrWorker) {
          const ok = await loadOcrEngine();
          if (!ok) return;
        }

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 }, // 1280x720 兼顾清晰度与手机解码帧率
            height: { ideal: 720 }
          }
        });
        video.srcObject = stream;
        await video.play();

        isRunning = true;
        btnToggle.textContent = '停止';
        btnToggle.classList.add('stop');
        statusBadge.textContent = '● 监控中：让黄色准星对准面单条码';
        runScanLoop();
      } catch (err) {
        alert('相机打开异常：' + err.message);
      }
    }

    function stopCamera() {
      isRunning = false;
      if (stream) stream.getTracks().forEach(t => t.stop());
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      btnToggle.textContent = '启动相机';
      btnToggle.classList.remove('stop');
      statusBadge.textContent = '已停止';
    }

    // 3. 高帧率扫描主循环
    async function runScanLoop() {
      if (!isRunning) return;

      if (video.videoWidth && overlay.width !== video.videoWidth) {
        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;
      }

      ctx.clearRect(0, 0, overlay.width, overlay.height);

      let foundBarcode = null;
      let roiRect = null;

      try {
        if (useNativeDetector && nativeDetector) {
          const barcodes = await nativeDetector.detect(video);
          if (barcodes.length > 0) {
            const b = barcodes[0];
            foundBarcode = b.rawValue;
            const box = b.boundingBox;
            roiRect = {
              x: Math.max(0, box.x - 10),
              y: box.y + box.height + 2,
              w: box.width + 20,
              h: box.height * 0.85
            };
            ctx.strokeStyle = '#30d158';
            ctx.strokeRect(box.x, box.y, box.width, box.height);
          }
        } else if (zxingReader) {
          // ZXing 兼容模式
          const result = await zxingReader.decodeOnceFromVideoDevice(undefined, 'video').catch(() => null);
          if (result) {
            foundBarcode = result.getText();
            const points = result.getResultPoints() || [];
            if (points.length >= 2) {
              const x1 = points[0].getX();
              const y1 = points[0].getY();
              const x2 = points[1].getX();
              const barW = Math.abs(x2 - x1) * 1.2;
              const barH = barW * 0.28;
              const barX = Math.min(x1, x2) - barW * 0.1;
              const barY = y1 - barH * 0.5;

              roiRect = {
                x: Math.max(0, barX),
                y: barY + barH + 4,
                w: barW,
                h: barH * 1.1
              };

              ctx.strokeStyle = '#30d158';
              ctx.lineWidth = 4;
              ctx.strokeRect(barX, barY, barW, barH);
            }
          }
        }
      } catch (e) {
        // 捕获跳帧
      }

      // 如果抓到了条形码
      if (foundBarcode && roiRect) {
        // 在屏幕上标出大字剪裁区
        ctx.strokeStyle = '#ffd60a';
        ctx.lineWidth = 3;
        ctx.strokeRect(roiRect.x, roiRect.y, roiRect.w, roiRect.h);

        // 如果该单号未被记录过，且当前 OCR 不在忙碌中，立即触发定向大字识别
        if (!processedBarcodes.has(foundBarcode) && !isOcrBusy) {
          triggerRoiOcr(foundBarcode, roiRect);
        }
      }

      requestAnimationFrame(runScanLoop);
    }

    // 4. 定向大字识别
    async function triggerRoiOcr(barcode, roi) {
      isOcrBusy = true;
      statusBadge.textContent = `锁定条码 ${barcode.slice(-4)}，正在切片提取三段码...`;

      try {
        cropCanvas.width = roi.w;
        cropCanvas.height = roi.h;
        // 把条形码下方的大字切片画到后台画板
        cropCtx.drawImage(video, roi.x, roi.y, roi.w, roi.h, 0, 0, roi.w, roi.h);

        const { data: { text } } = await ocrWorker.recognize(cropCanvas);
        const clean = text.replace(/[\r\n\s]/g, '');

        if (clean.length >= 3) {
          handleResult(barcode, clean);
        } else {
          appendLog(`识别略过: 文字不清晰或切片过小 (${clean})`);
        }
      } catch (err) {
        console.error('OCR 错误', err);
      } finally {
        isOcrBusy = false;
        if (isRunning) statusBadge.textContent = '● 正在监控流水线...';
      }
    }

    // 5. 比对与报警
    function handleResult(barcode, fullText) {
      if (processedBarcodes.has(barcode)) return;
      processedBarcodes.add(barcode);

      totalDetected++;
      totalCountEl.textContent = totalDetected;

      const targets = targetInput.value
        .split(/[,，\s]+/)
        .map(t => t.trim())
        .filter(Boolean);

      const isHit = targets.some(target => fullText.includes(target));

      if (isHit) {
        hitDetected++;
        hitCountEl.textContent = hitDetected;
        playAlarm();
        appendLog(`【命中】单号:${barcode.slice(-5)} | 内容:${fullText}`, true);
      } else {
        appendLog(`已扫: 单号:${barcode.slice(-5)} | 内容:${fullText}`);
      }
    }

    function appendLog(msg, isHit = false) {
      const el = document.createElement('div');
      el.className = 'log-item' + (isHit ? ' hit' : '');
      const time = new Date().toTimeString().slice(0, 8);
      el.textContent = `${time} ${msg}`;
      logBox.insertBefore(el, logBox.firstChild);
      if (logBox.children.length > 25) logBox.removeChild(logBox.lastChild);
    }

    btnToggle.addEventListener('click', () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (isRunning) stopCamera();
      else startCamera();
    });

    btnReset.addEventListener('click', () => {
      totalDetected = 0;
      hitDetected = 0;
      totalCountEl.textContent = '0';
      hitCountEl.textContent = '0';
      processedBarcodes.clear();
      logBox.innerHTML = '';
      appendLog('记录已重置');
    });

    // 检查环境
    checkCapabilities();
  </script>
</body>
</html>
